name: Compilation IPTV Player

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: "2.8"

jobs:
  verification:
    name: Vérification du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Préparer les plateformes
        run: bash tool/setup_platforms.sh
      - name: Analyse
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E "^\s*error •" analyze.txt | head -45 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code
      - name: Tests
        run: flutter test

